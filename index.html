<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infobip Solution Engineering Demo</title><style>body{font-family:system-ui;max-width:760px;margin:48px auto;padding:0 20px;line-height:1.5}textarea{width:100%;min-height:100px}button{padding:10px 16px;margin-top:8px}pre{white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:8px}.note{padding:12px;background:#fff8dc;border-radius:8px}</style></head><body><h1>Infobip Solution Engineering Demo</h1><p class="note">Synthetic portfolio demonstration. This is not a banking service and is not connected to real bank accounts.</p><p>Use this page to test the routing logic locally on the deployed service. It calls <code>/simulate</code>; it does not send a WhatsApp message.</p><textarea id="m">What is AMEEN?</textarea><br><button onclick="go()">Simulate inbound message</button><pre id="o"></pre><script>async function go(){const id=crypto.randomUUID();const payload={results:[{messageId:id,from:"synthetic-user",message:{text:document.getElementById("m").value}}]};const r=await fetch("/simulate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});document.getElementById("o").textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
